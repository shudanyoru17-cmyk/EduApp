org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Pin the Gradle daemon to a JDK supported by AGP 8.5.2 / Kotlin 2.0.20 (JDK 17).
# Running on JDK 23+ makes the Kotlin compiler invoked by KSP (:app:kspDebugKotlin) fail.
# NOTE: this path is machine-specific. Adjust it on other machines/CI, or remove this
# line and set the Gradle JDK in Android Studio (Settings > Build Tools > Gradle > Gradle JDK).
#org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
